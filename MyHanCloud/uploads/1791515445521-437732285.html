<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Drive UI</title>

  <!-- CDN Bootstrap CSS & Icons (Langsung connect tanpa ribet path) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="d-flex" id="wrapper">

    <!-- 1. SIDEBAR / NAVBAR KIRI (Sticky) -->
    <aside class="sidebar border-end bg-light d-flex flex-column p-3">
      <a href="#" class="d-flex align-items-center mb-4 text-decoration-none text-dark">
        <i class="bi bi-cloud-fill text-primary fs-3 me-2"></i>
        <span class="fs-5 fw-bold">MyCloud</span>
      </a>

      <!-- Tombol Baru (buka file manager) -->
      <button class="btn btn-primary rounded-pill py-2 mb-4 d-flex align-items-center justify-content-center shadow-sm" id="btn-new">
        <i class="bi bi-plus-lg me-2"></i> Baru
      </button>
      <input type="file" id="file-input" multiple class="d-none" aria-hidden="true">

      <!-- Menu Navigasi -->
      <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item">
          <a href="#" class="nav-link active" data-view="drive">
            <i class="bi bi-folder2-open me-2"></i> Drive Saya
          </a>
        </li>
        <li>
          <a href="#" class="nav-link text-dark" data-view="shared">
            <i class="bi bi-people me-2"></i> Dibagikan
          </a>
        </li>
        <li>
          <a href="#" class="nav-link text-dark" data-view="recent">
            <i class="bi bi-clock-history me-2"></i> Terbaru
          </a>
        </li>
        <li>
          <a href="#" class="nav-link text-dark" data-view="starred">
            <i class="bi bi-star me-2"></i> Berbintang
          </a>
        </li>
        <li>
          <a href="#" class="nav-link text-dark" data-view="trash">
            <i class="bi bi-trash me-2"></i> Sampah
          </a>
        </li>
      </ul>

      <hr>

      <!-- Storage Info -->
      <div class="storage-info small text-muted">
        <i class="bi bi-cloud-check me-1"></i> Penyimpanan
        <div class="progress my-2" style="height: 6px;">
          <div class="progress-bar bg-primary" role="progressbar" id="storage-bar" style="width: 45%;"></div>
        </div>
        <span id="storage-text">0 KB dari 15 GB digunakan</span>
      </div>
    </aside>

    <!-- 2. AREA KONTEN UTAMA -->
    <div id="page-content-wrapper" class="w-100 d-flex flex-column">

      <!-- TOP NAVBAR -->
      <nav class="navbar navbar-expand navbar-light bg-white border-bottom sticky-top px-4">
        <div class="container-fluid p-0">
          <form class="d-flex flex-grow-1 max-w-50 me-3">
            <div class="input-group bg-light rounded-pill px-3 py-1">
              <span class="input-group-text bg-transparent border-0"><i class="bi bi-search"></i></span>
              <input class="form-control bg-transparent border-0 shadow-none" type="search" placeholder="Cari di Drive..." aria-label="Search">
            </div>
          </form>

          <div class="d-flex align-items-center ms-auto gap-3">
            <button class="btn btn-light rounded-circle"><i class="bi bi-gear"></i></button>
            <div class="avatar rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fw-bold" style="width: 38px; height: 38px;">
              U
            </div>
          </div>
        </div>
      </nav>

      <!-- MAIN CONTENT (di-render oleh sscript.js) -->
      <main class="container-fluid p-4 overflow-hidden" id="view-root"></main>

    </div>

  </div>

  <!-- Modal aksi item (bintang / unduh / bagikan / hapus / pulihkan) -->
  <div class="modal fade" id="item-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title text-truncate" id="item-modal-title">Item</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <div class="modal-body px-4" id="item-modal-body"></div>
      </div>
    </div>
  </div>

  <!-- Tempat notifikasi toast -->
  <div id="toast-host" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <!-- CDN Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script Custom -->
  <script src="sscript.js"></script>
</body>
</html>
